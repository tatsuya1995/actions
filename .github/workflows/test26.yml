name: Multi Account

on: pull_request

jobs:
  list_s3_buckets:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        environment: ${{ fromJson(format('["{0}"]', env.ENVIRONMENTS)) }}
    environment:
      name: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Environments
        run: |
          environments=$(gh api /repos/tatsuya1995/actions/environments --jq -r '.environments[].name')
          echo "ENVIRONMENTS=$environments" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Debug GITHUB_ENV
        run: echo "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: List S3 bucket
        run: aws s3 ls s3://test-oac.com
